[project]
name = "transbridge"
version = "0.1.1.1"
description = "TransBridge is a translation file conversion tool designed to seamlessly transfer translation files between Xtranslator, ESP-ESM Translator, and ParaTranz."
readme = "README.md"
authors = [
    { name = "BuMing119", email = "bumingjueli119@gmail.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "ruff>=0.14.10",
    "sse-plugin-interface>=1.0.1",
    "openai>=1.0",
    "anthropic>=0.20",
    "PyQt6>=6.5",
    # Vector search for semantic term matching
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2.2",
    "py7zr>=1.1.0",
    "rarfile>=4.2",
    "jsonschema>=4.23.0",
    "requests>=2.33.0",
    "sse-bsa>=1.1.0",
    # Fixed torch version to avoid conflict with PyQt6
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
]

[project.scripts]
transbridge = "transbridge.cli:main"
transbridge-mcp = "transbridge.entrypoints.mcp:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
preview = true
target-version = "py312"
extend-exclude = [".git", "__pycache__", "build", "dist", ".venv"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "ARG", "PLR0913"]  # 允许 assert、忽略未使用参数、多参数
"scripts/*.py" = ["T20", "E501"]            # 允许 print（脚本调试用）

[tool.ruff.lint.isort]
known-first-party = ["julianos"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests that require LLM API access",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
