[meta]
name = "translate_with_terms"
display_name = "术语辅助翻译"
description = "Run a translation task with the project's configured terminology and language profile"
version = "1.1"
enabled = true

[trigger]
keywords = ["翻译", "术语", "标准化", "统一译名"]
requires_tools = ["start_translation"]

[prompt]
template = """
Use start_translation for the entries the user requested. The translation task uses the
configured language profile and terminology settings. Report its actual outcome when it finishes.
"""

[tools]
allowed = ["start_translation"]
